
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CampusVibe - UI Animation</title>

    <style>
        /* UNIVERSAL STYLING */
        * {
            box-sizing: border-box;
        }

        /* BODY STYLING */
        body {
            background: linear-gradient(
                135deg,
                #252747,
                #493080
            );
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* WEBSITE HEADING */
        .website-heading {
            color: white;
            text-align: center;
            font-size: 38px;
            position: relative;
            animation: headingSlideAnimation 4s infinite;
        }

        /* HEADING SLIDING ANIMATION */
        @keyframes headingSlideAnimation {

            0% {
                transform: translateX(0);
            }

            50% {
                transform: translateX(80px);
            }

            100% {
                transform: translateX(0);
            }
        }

        /* WEBSITE TAGLINE */
        .website-tagline {
            text-align: center;
            color: #d8b4fe;
            font-size: 20px;
        }

        /* ANIMATION AREA */
        .animation-area {
            position: relative;
            width: 100%;
            max-width: 1100px;
            height: 450px;
            margin: 40px auto;
        }

        /* ANIMATED IMAGE CONTAINER */
        .animated-image-container {
            position: absolute;
            width: 320px;
            height: 180px;

            animation:
                imageMovementAnimation 8s infinite;
        }

        /* CAMPUSVIBE IMAGE STYLING */
        .campus-event-image {
            width: 100%;
            height: 100%;
            object-fit: contain;

            border: 4px solid #a855f7;
            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.4);
        }

        /* IMAGE MOVEMENT ANIMATION */
        @keyframes imageMovementAnimation {

            /* TOP LEFT */
            0% {
                top: 0;
                left: 0;
                transform: scale(1);
            }

            /* TOP RIGHT */
            25% {
                top: 0;
                left: calc(100% - 320px);
                transform: scale(0.5);
            }

            /* BOTTOM RIGHT */
            50% {
                top: 270px;
                left: calc(100% - 320px);
                transform: scale(0.25);
            }

            /* BOTTOM LEFT */
            75% {
                top: 270px;
                left: 0;
                transform: scale(0.5);
            }

            /* RETURN TO START */
            100% {
                top: 0;
                left: 0;
                transform: scale(1);
            }
        }

        /* TABLET SCREEN RESPONSIVENESS */
        @media screen and (max-width: 900px) {

            .website-heading {
                font-size: 30px;
            }

            .website-tagline {
                font-size: 18px;
            }

            .animation-area {
                height: 380px;
            }

            .animated-image-container {
                width: 250px;
                height: 145px;
            }

            @keyframes imageMovementAnimation {

                0%, 100% {
                    top: 0;
                    left: 0;
                    transform: scale(1);
                }

                25% {
                    top: 0;
                    left: calc(100% - 250px);
                    transform: scale(0.5);
                }

                50% {
                    top: 235px;
                    left: calc(100% - 250px);
                    transform: scale(0.25);
                }

                75% {
                    top: 235px;
                    left: 0;
                    transform: scale(0.5);
                }
            }
        }

        /* MOBILE SCREEN RESPONSIVENESS */
        @media screen and (max-width: 500px) {

            body {
                padding: 15px;
            }

            .website-heading {
                font-size: 25px;
                animation: none;
            }

            .website-tagline {
                font-size: 16px;
            }

            .animation-area {
                height: 300px;
            }

            .animated-image-container {
                width: 180px;
                height: 105px;
            }

            @keyframes imageMovementAnimation {

                0%, 100% {
                    top: 0;
                    left: 0;
                    transform: scale(1);
                }

                25% {
                    top: 0;
                    left: calc(100% - 180px);
                    transform: scale(0.5);
                }

                50% {
                    top: 195px;
                    left: calc(100% - 180px);
                    transform: scale(0.25);
                }

                75% {
                    top: 195px;
                    left: 0;
                    transform: scale(0.5);
                }
            }
        }

        /* REDUCED MOTION ACCESSIBILITY */
        @media (prefers-reduced-motion: reduce) {

            .website-heading,
            .animated-image-container {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <!-- CAMPUSVIBE WEBSITE HEADING -->
    <header>

        <h1 class="website-heading">
            Welcome to CampusVibe
        </h1>

        <!-- WEBSITE TAGLINE -->
        <p class="website-tagline">
            Where Campus Life Comes Alive!
        </p>

    </header>

    <!-- CAMPUSVIBE IMAGE ANIMATION -->
    <main>

        <section class="animation-area"
                 aria-label="CampusVibe Animation">

            <div class="animated-image-container">

                <img
                    src="/Micro.png"
                    alt="CampusVibe College Event Portal"
                    class="campus-event-image"
                >

            </div>

        </section>

    </main>

</body>
</html>
